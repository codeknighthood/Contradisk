<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rulebook That Argues With Itself</title>
<style>
body{font-family:Inter,system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#f5f7fb;color:#18202a}textarea{width:100%;box-sizing:border-box;min-height:100px;padding:14px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}button{margin-top:12px;padding:11px 18px;border:0;border-radius:9px;background:#18202a;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:20px}.card{background:white;border:1px solid #e0e5ec;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}.status{font-weight:800;letter-spacing:.04em}.citation{border-top:1px solid #e7ebf1;padding:12px 0}.meta{font-size:13px;color:#687386}.text{white-space:pre-wrap;line-height:1.55}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>The Rulebook That Argues With Itself</h1>
<p>Ask about the student rules. The system may answer, say the corpus does not cover it, or expose a conflict.</p>
<textarea id="q" placeholder="e.g. Over what period is the 75% attendance requirement calculated?"></textarea>
<button onclick="ask()">Ask the rulebook</button>
<div class="grid">
  <div class="card"><div id="answer">No question yet.</div></div>
  <div class="card"><h3>Evidence</h3><div id="evidence">Citations will appear here.</div></div>
</div>
<script>
async function ask(){
 const q=document.getElementById('q').value.trim(); if(!q)return;
 document.getElementById('answer').innerText='Checking the corpus…';
 const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
 const d=await r.json();
 document.getElementById('answer').innerHTML=`<div class="status">${d.status}</div><p class="text">${escapeHtml(d.answer)}</p><div class="meta">Decision score: ${d.decision_score} · ${escapeHtml(d.retrieval_backend)}</div>`;
 document.getElementById('evidence').innerHTML=d.citations.map(c=>`<div class="citation"><b>${escapeHtml(c.section_ref)}</b> <span class="meta">· ${escapeHtml(c.source)}${c.page?` · page ${c.page}`:''} · similarity ${c.similarity_score}</span><p class="text">${escapeHtml(c.text)}</p></div>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
</script>
</body></html>
